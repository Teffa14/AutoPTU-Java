name: Intercept Candidate Discovery Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/runtime/InterceptCandidateDiscoveryResolution.java"
      - "src/main/java/io/autoptu/core/runtime/CombatantRuleContent.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeInterceptCandidateDiscoveryFactory.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeInterceptCandidateCleanupApplication.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeInterceptAttemptPlanner.java"
      - "src/test/java/io/autoptu/core/runtime/InterceptCandidateDiscoveryResolutionTest.java"
      - "src/test/java/io/autoptu/core/runtime/InterceptCandidateDiscoveryOracleParityTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeInterceptCandidateDiscoveryFactoryTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeInterceptCandidateCleanupApplicationTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeInterceptAttemptPlannerTest.java"
      - "tools/python/export_intercept_candidate_discovery_contract.py"
      - ".github/workflows/intercept-candidate-discovery-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python intercept candidate discovery contract
        run: |
          python3 -m py_compile tools/python/export_intercept_candidate_discovery_contract.py
          python3 tools/python/export_intercept_candidate_discovery_contract.py \
            --source-root python-oracle \
            --output build/oracle/intercept-candidate-discovery.tsv
          cat build/oracle/intercept-candidate-discovery.tsv

      - name: Run intercept candidate discovery parity tests
        run: >-
          gradle test --stacktrace
          -Dautoptu.intercept.candidate.discovery.oracle="$GITHUB_WORKSPACE/build/oracle/intercept-candidate-discovery.tsv"
          --tests io.autoptu.core.runtime.InterceptCandidateDiscoveryOracleParityTest
          --tests io.autoptu.core.runtime.InterceptCandidateDiscoveryResolutionTest
          --tests io.autoptu.core.runtime.RuntimeInterceptCandidateDiscoveryFactoryTest
          --tests io.autoptu.core.runtime.RuntimeInterceptCandidateCleanupApplicationTest
          --tests io.autoptu.core.runtime.RuntimeInterceptAttemptPlannerTest
