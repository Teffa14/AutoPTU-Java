name: Round Start Ability Dispatch Plan Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  round-start-ability-dispatch-plan:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze Python round-start ability orchestration and Air Lock effect
        run: |
          python3 -m py_compile tools/python/export_round_start_ability_dispatch_fixture.py
          python3 tools/python/export_round_start_ability_dispatch_fixture.py \
            --source-root python-oracle \
            --output build/oracle/round-start-ability-dispatch.tsv
          cat build/oracle/round-start-ability-dispatch.tsv

      - name: Compare Java round-start ability dispatch and Air Lock effect
        run: |
          gradle test --stacktrace \
            --tests io.autoptu.core.runtime.RoundStartAbilityDispatchPlanTest \
            --tests io.autoptu.core.runtime.RoundStartAbilityDispatchPlanOracleParityTest \
            --tests io.autoptu.core.runtime.RoundStartAbilityInvocationExecutorTest \
            --tests io.autoptu.core.runtime.RoundStartAirLockEffectOracleParityTest \
            --tests io.autoptu.core.runtime.RoundStartTrainerFeatureLifecycleOracleParityTest \
            --tests io.autoptu.core.runtime.RoundStartEffectsLifecycleTest
