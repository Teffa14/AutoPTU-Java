name: Forced Movement Instruction Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/rules/ForcedMovementInstruction*.java"
      - "src/main/java/io/autoptu/core/runtime/ForcedDisplacementResolution.java"
      - "src/main/java/io/autoptu/core/runtime/ForcedMovementApplication.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeForcedMovementMoveApplication.java"
      - "src/main/java/io/autoptu/core/runtime/MoveChoiceRevalidation.java"
      - "src/test/java/io/autoptu/core/rules/ForcedMovementInstructionOracleParityTest.java"
      - "src/test/java/io/autoptu/core/runtime/ForcedDisplacementResolutionTest.java"
      - "src/test/java/io/autoptu/core/runtime/ForcedMovementApplicationTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeForcedMovementMoveApplicationTest.java"
      - "tools/python/export_forced_movement_instruction_fixtures.py"
      - ".github/workflows/forced-movement-instruction-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python oracle fixture
        run: |
          python3 -m py_compile tools/python/export_forced_movement_instruction_fixtures.py
          python3 tools/python/export_forced_movement_instruction_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-instruction.tsv

      - name: Run forced movement instruction and displacement tests
        env:
          AUTOPTU_FORCED_MOVEMENT_INSTRUCTION_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-instruction.tsv
        run: >-
          gradle test --stacktrace
          --tests io.autoptu.core.rules.ForcedMovementInstructionOracleParityTest
          --tests io.autoptu.core.runtime.ForcedDisplacementResolutionTest
          --tests io.autoptu.core.runtime.ForcedMovementApplicationTest
          --tests io.autoptu.core.runtime.RuntimeForcedMovementMoveApplicationTest
