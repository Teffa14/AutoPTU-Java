name: Runtime Ordinary Damage Ingress Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  runtime-ordinary-damage-ingress-parity:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Validate exporter
        run: python3 -m py_compile tools/python/export_runtime_ordinary_damage_ingress_fixtures.py

      - name: Export pinned Python fixture
        run: >-
          python3 tools/python/export_runtime_ordinary_damage_ingress_fixtures.py
          --source-root python-oracle
          --output build/oracle/runtime-ordinary-damage-ingress.tsv

      - name: Compare Java state transition with Python oracle
        env:
          AUTOPTU_RUNTIME_ORDINARY_DAMAGE_INGRESS_ORACLE: ${{ github.workspace }}/build/oracle/runtime-ordinary-damage-ingress.tsv
        run: >-
          gradle test --stacktrace
          --tests io.autoptu.core.runtime.RuntimeOrdinaryDamageIngressOracleParityTest
