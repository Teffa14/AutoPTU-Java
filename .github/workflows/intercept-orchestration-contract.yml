name: Intercept Orchestration Contract

on:
  pull_request:
    paths:
      - "tools/python/export_intercept_orchestration_contract.py"
      - ".github/workflows/intercept-orchestration-contract.yml"
      - "src/main/java/io/autoptu/core/runtime/**"
      - "src/test/java/io/autoptu/core/runtime/**"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze Python intercept orchestration
        run: |
          python3 -m py_compile tools/python/export_intercept_orchestration_contract.py
          python3 tools/python/export_intercept_orchestration_contract.py \
            --source-root python-oracle \
            --output build/oracle/intercept-orchestration.tsv
          cat build/oracle/intercept-orchestration.tsv

      - name: Verify server-owned intercept RNG check
        run: gradle test --tests io.autoptu.core.runtime.RuntimeInterceptCheckApplicationTest
