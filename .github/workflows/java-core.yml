name: Java Core Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-java-core:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python migration tools
        run: python3 -m py_compile tools/python/export_runtime_types.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Java core tests
        run: gradle test --stacktrace
