name: Reaction Usage State Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/runtime/ReactionUsageState.java"
      - "src/test/java/io/autoptu/core/runtime/ReactionUsageStateTest.java"
      - "src/test/java/io/autoptu/core/runtime/ReactionUsageOracleParityTest.java"
      - "tools/python/export_attack_of_opportunity_usage_fixture.py"
      - ".github/workflows/reaction-usage-state-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export pinned Python usage fixture
        run: |
          python3 -m py_compile tools/python/export_attack_of_opportunity_usage_fixture.py
          python3 tools/python/export_attack_of_opportunity_usage_fixture.py \
            --source-root python-oracle \
            --output build/oracle/reaction-usage.tsv

      - name: Run reaction usage state parity
        env:
          AUTOPTU_REACTION_USAGE_ORACLE: ${{ github.workspace }}/build/oracle/reaction-usage.tsv
        run: |
          gradle test \
            --tests io.autoptu.core.runtime.ReactionUsageStateTest \
            --tests io.autoptu.core.runtime.ReactionUsageOracleParityTest \
            --stacktrace
