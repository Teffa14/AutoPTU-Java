name: Move Special Roll Penalty Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  move-special-roll-penalty-parity:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export move-special roll penalty oracle fixtures
        run: |
          python3 -m py_compile tools/python/export_move_special_roll_penalty_fixtures.py
          python3 tools/python/export_move_special_roll_penalty_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/move-special-roll-penalty.tsv

      - name: Run move-special roll penalty parity and Java regression suite
        env:
          JAVA_TOOL_OPTIONS: -Dautoptu.move.special.roll.penalty.oracle=${{ github.workspace }}/build/oracle/move-special-roll-penalty.tsv
        run: gradle test --stacktrace
