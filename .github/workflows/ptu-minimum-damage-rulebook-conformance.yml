name: PTU Minimum Damage Rulebook Conformance

on:
  pull_request:
    paths:
      - 'src/main/java/io/autoptu/core/rules/DamageResolution.java'
      - 'src/test/java/io/autoptu/core/rules/DamageResolutionTest.java'
      - '.github/workflows/ptu-minimum-damage-rulebook-conformance.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/java/io/autoptu/core/rules/DamageResolution.java'
      - 'src/test/java/io/autoptu/core/rules/DamageResolutionTest.java'
      - '.github/workflows/ptu-minimum-damage-rulebook-conformance.yml'

jobs:
  minimum-damage-rulebook:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Verify PTU ordinary minimum-damage invariant
        run: gradle test --tests io.autoptu.core.rules.DamageResolutionTest --stacktrace

      - name: Confirm neutral ordinary damage clamps at one after Defense
        run: |
          grep -F 'Math.max(1, damageRoll + check.attackValue() - check.defenseValue())' \
            src/main/java/io/autoptu/core/rules/DamageResolution.java
