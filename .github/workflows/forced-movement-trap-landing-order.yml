name: Forced Movement Trap Landing Order

on:
  pull_request:
    paths:
      - 'tools/python/export_forced_movement_trap_landing_order.py'
      - '.github/workflows/forced-movement-trap-landing-order.yml'
      - 'src/main/java/io/autoptu/core/event/BattleEvent.java'
      - 'src/main/java/io/autoptu/core/event/BattleEventKind.java'
      - 'src/main/java/io/autoptu/core/event/TerrainHazardEvent.java'
      - 'src/main/java/io/autoptu/core/runtime/BattleRuntime.java'
      - 'src/main/java/io/autoptu/core/runtime/RuntimeMoveResolution.java'
      - 'src/main/java/io/autoptu/core/runtime/DelayedHitBindingResolver.java'
      - 'src/main/java/io/autoptu/core/runtime/ForcedMovementApplication.java'
      - 'src/main/java/io/autoptu/core/runtime/RuntimePostHitForcedMovementApplication.java'
      - 'src/main/java/io/autoptu/core/runtime/RuntimeMovementLandingApplication.java'
      - 'src/main/java/io/autoptu/core/runtime/RuntimeMovementLandingContext.java'
      - 'src/main/java/io/autoptu/core/runtime/MovementLandingHookRegistry.java'
      - 'src/main/java/io/autoptu/core/runtime/MovementLandingConsequenceExecutor.java'
      - 'src/main/java/io/autoptu/core/runtime/TileEntryTrapResolution.java'
      - 'src/test/java/io/autoptu/core/runtime/RuntimePostHitForcedMovementLandingTest.java'
      - 'src/test/java/io/autoptu/core/runtime/ForcedMovementLandingCrossProducerTest.java'
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze forced movement to trap landing order
        run: |
          python3 -m py_compile tools/python/export_forced_movement_trap_landing_order.py
          python3 tools/python/export_forced_movement_trap_landing_order.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-trap-landing-order.tsv
          cat build/oracle/forced-movement-trap-landing-order.tsv

      - name: Verify Java landing consequences and public hazard events
        run: |
          gradle test --tests 'io.autoptu.core.runtime.RuntimePostHitForcedMovementLandingTest' \
            --tests 'io.autoptu.core.runtime.ForcedMovementLandingCrossProducerTest'
