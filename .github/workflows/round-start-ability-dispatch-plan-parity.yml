name: Round Start Ability Dispatch Plan Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  round-start-ability-dispatch-plan:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze Python round-start ability behavior
        run: |
          python3 -m py_compile \
            tools/python/export_round_start_ability_dispatch_fixture.py \
            tools/python/export_transformation_state_fixture.py \
            tools/python/export_impostor_negative_guard_fixture.py \
            tools/python/export_arena_trap_targeting_fixture.py \
            tools/python/export_active_ability_holders_fixture.py \
            tools/python/export_intimidate_trigger_fixture.py \
            tools/python/export_intimidate_effect_fixture.py \
            tools/python/export_intimidate_prevention_fixture.py \
            tools/python/export_intimidate_flower_veil_fixture.py \
            tools/python/export_intimidate_mirror_armor_fixture.py \
            tools/python/export_intimidate_stage_reaction_fixture.py
          python3 tools/python/export_round_start_ability_dispatch_fixture.py \
            --source-root python-oracle \
            --output build/oracle/round-start-ability-dispatch.tsv
          python3 tools/python/export_transformation_state_fixture.py \
            --source-root python-oracle \
            --output build/oracle/transformation-state.tsv
          python3 tools/python/export_impostor_negative_guard_fixture.py \
            --source-root python-oracle \
            --output build/oracle/impostor-negative-guards.tsv
          python3 tools/python/export_arena_trap_targeting_fixture.py \
            --source-root python-oracle \
            --output build/oracle/arena-trap-targeting.tsv
          python3 tools/python/export_active_ability_holders_fixture.py \
            --source-root python-oracle \
            --output build/oracle/active-ability-holders.tsv
          python3 tools/python/export_intimidate_trigger_fixture.py \
            --source-root python-oracle \
            --output build/oracle/intimidate-trigger.tsv
          python3 tools/python/export_intimidate_effect_fixture.py \
            --source-root python-oracle \
            --output build/oracle/intimidate-effect.tsv
          python3 tools/python/export_intimidate_prevention_fixture.py \
            --source-root python-oracle \
            --output build/oracle/intimidate-prevention.tsv
          python3 tools/python/export_intimidate_flower_veil_fixture.py \
            --source-root python-oracle \
            --output build/oracle/intimidate-flower-veil.tsv
          python3 tools/python/export_intimidate_mirror_armor_fixture.py \
            --source-root python-oracle \
            --output build/oracle/intimidate-mirror-armor.tsv
          python3 tools/python/export_intimidate_stage_reaction_fixture.py \
            --source-root python-oracle \
            --output build/oracle/intimidate-stage-reactions.tsv
          cat build/oracle/round-start-ability-dispatch.tsv
          cat build/oracle/transformation-state.tsv
          cat build/oracle/impostor-negative-guards.tsv
          cat build/oracle/arena-trap-targeting.tsv
          cat build/oracle/active-ability-holders.tsv
          cat build/oracle/intimidate-trigger.tsv
          cat build/oracle/intimidate-effect.tsv
          cat build/oracle/intimidate-prevention.tsv
          cat build/oracle/intimidate-flower-veil.tsv
          cat build/oracle/intimidate-mirror-armor.tsv
          cat build/oracle/intimidate-stage-reactions.tsv

      - name: Compare Java round-start ability behavior
        run: |
          gradle test --stacktrace \
            --tests io.autoptu.core.runtime.RoundStartAbilityDispatchPlanTest \
            --tests io.autoptu.core.runtime.RoundStartAbilityDispatchPlanOracleParityTest \
            --tests io.autoptu.core.runtime.TransformationStateResolverOracleParityTest \
            --tests io.autoptu.core.runtime.ImpostorRandomChoiceOracleParityTest \
            --tests io.autoptu.core.runtime.ImpostorNegativeGuardOracleParityTest \
            --tests io.autoptu.core.runtime.RoundStartAbilityInvocationExecutorTest \
            --tests io.autoptu.core.runtime.RoundStartAirLockEffectOracleParityTest \
            --tests io.autoptu.core.runtime.ArenaTrapTargetingContractOracleParityTest \
            --tests io.autoptu.core.runtime.ArenaTrapRuntimeCandidateProjectionOracleParityTest \
            --tests io.autoptu.core.runtime.ArenaTrapEffectPlanTest \
            --tests io.autoptu.core.runtime.StatusEffectMutationExecutorTest \
            --tests io.autoptu.core.runtime.ArenaTrapEffectMutationOracleParityTest \
            --tests io.autoptu.core.runtime.ActiveAbilityHolderResolverOracleParityTest \
            --tests io.autoptu.core.runtime.RoundStartArenaTrapHandlerOracleParityTest \
            --tests io.autoptu.core.runtime.IntimidateTriggerContractOracleParityTest \
            --tests io.autoptu.core.runtime.IntimidateEffectExecutionOracleParityTest \
            --tests io.autoptu.core.runtime.IntimidatePreventionInteractionOracleParityTest \
            --tests io.autoptu.core.runtime.IntimidateFlowerVeilInteractionOracleParityTest \
            --tests io.autoptu.core.runtime.IntimidateMirrorArmorInteractionOracleParityTest \
            --tests io.autoptu.core.runtime.IntimidateStageReactionOracleParityTest \
            --tests io.autoptu.core.runtime.RoundStartTrainerFeatureLifecycleOracleParityTest \
            --tests io.autoptu.core.runtime.RoundStartEffectsLifecycleTest
