name: Attack of Opportunity Trigger Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/hook/ActionWindowTrigger.java"
      - "src/main/java/io/autoptu/core/hook/AttackOfOpportunityTriggerDetector.java"
      - "src/test/java/io/autoptu/core/hook/AttackOfOpportunityTriggerDetectorTest.java"
      - "src/test/java/io/autoptu/core/hook/AttackOfOpportunityOracleParityTest.java"
      - "tools/python/export_attack_of_opportunity_trigger_fixtures.py"
      - ".github/workflows/attack-of-opportunity-trigger-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export pinned Python trigger fixture
        run: |
          python3 -m py_compile tools/python/export_attack_of_opportunity_trigger_fixtures.py
          python3 tools/python/export_attack_of_opportunity_trigger_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/attack-of-opportunity-triggers.tsv

      - name: Run Attack of Opportunity trigger parity
        env:
          AUTOPTU_ATTACK_OF_OPPORTUNITY_ORACLE: ${{ github.workspace }}/build/oracle/attack-of-opportunity-triggers.tsv
        run: |
          gradle test \
            --tests io.autoptu.core.hook.AttackOfOpportunityTriggerDetectorTest \
            --tests io.autoptu.core.hook.AttackOfOpportunityOracleParityTest \
            --stacktrace
