name: Pre-Damage Reaction Contract

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/hook/BuiltinPreDamageReactionHooks.java"
      - "src/main/java/io/autoptu/core/hook/OutOfTurnDecisionGate.java"
      - "src/main/java/io/autoptu/core/hook/OutOfTurnDecisionRequest.java"
      - "src/main/java/io/autoptu/core/hook/PreDamageReactionContext.java"
      - "src/main/java/io/autoptu/core/hook/PreDamageReactionHook.java"
      - "src/main/java/io/autoptu/core/hook/PreDamageReactionHookRegistry.java"
      - "src/main/java/io/autoptu/core/hook/PreDamageReactionResult.java"
      - "src/main/java/io/autoptu/core/runtime/ReactionPushApplication.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimePreDamageReactionContextFactory.java"
      - "src/test/java/io/autoptu/core/hook/BuiltinPreDamageReactionHooksTest.java"
      - "src/test/java/io/autoptu/core/hook/ParryPreDamageReactionTest.java"
      - "src/test/java/io/autoptu/core/hook/PreDamageReactionContractTest.java"
      - "src/test/java/io/autoptu/core/hook/SwayPreDamageReactionTest.java"
      - "tools/python/export_pre_damage_reaction_contract.py"
      - ".github/workflows/pre-damage-reaction-contract.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python oracle contract
        run: |
          python3 -m py_compile tools/python/export_pre_damage_reaction_contract.py
          python3 tools/python/export_pre_damage_reaction_contract.py \
            --source-root python-oracle \
            --output build/oracle/pre-damage-reaction.tsv

      - name: Run pre-damage reaction contract parity
        env:
          AUTOPTU_PRE_DAMAGE_REACTION_ORACLE: ${{ github.workspace }}/build/oracle/pre-damage-reaction.tsv
        run: |
          gradle test \
            --tests io.autoptu.core.hook.PreDamageReactionContractTest \
            --tests io.autoptu.core.hook.BuiltinPreDamageReactionHooksTest \
            --tests io.autoptu.core.hook.ParryPreDamageReactionTest \
            --tests io.autoptu.core.hook.SwayPreDamageReactionTest \
            --stacktrace
