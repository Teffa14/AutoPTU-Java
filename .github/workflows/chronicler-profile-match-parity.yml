name: Chronicler Profile Match Parity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze Python Chronicler profile-match contract
        run: |
          python3 -m py_compile tools/python/export_chronicler_profile_match_contract.py
          python3 tools/python/export_chronicler_profile_match_contract.py \
            --source-root python-oracle \
            --output build/oracle/chronicler-profile-match.tsv

      - name: Run Chronicler profile-match parity tests
        env:
          AUTOPTU_CHRONICLER_PROFILE_MATCH_ORACLE: ${{ github.workspace }}/build/oracle/chronicler-profile-match.tsv
        run: |
          gradle test --stacktrace \
            --tests io.autoptu.core.runtime.ChroniclerProfileMatchOracleParityTest \
            --tests io.autoptu.core.runtime.ChroniclerRuntimeOwnershipTest
