name: Held Item Rule Catalog Parity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export held-item catalog contract
        run: |
          python3 -m py_compile tools/python/export_held_item_rule_catalog_contract.py
          python3 tools/python/export_held_item_rule_catalog_contract.py \
            --source-root python-oracle \
            --output build/oracle/held-item-rule-catalog.tsv

      - name: Run held-item catalog parity tests
        run: >-
          gradle test --stacktrace
          -Dautoptu.held.item.catalog.oracle="$GITHUB_WORKSPACE/build/oracle/held-item-rule-catalog.tsv"
          --tests io.autoptu.core.runtime.HeldItemRuleCatalogOracleParityTest
          --tests io.autoptu.core.runtime.HeldItemRuleCatalogTest
