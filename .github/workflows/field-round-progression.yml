name: Field Round Progression Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  field-round-progression:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python field progression fixtures
        run: |
          python3 -m py_compile tools/python/export_field_round_progression_fixtures.py
          python3 tools/python/export_field_round_progression_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/field-round-progression.tsv
          cat build/oracle/field-round-progression.tsv

      - name: Run field progression parity tests
        run: |
          gradle test --stacktrace \
            --tests io.autoptu.core.runtime.FieldRoundProgressionOracleParityTest \
            --tests io.autoptu.core.runtime.FieldRoundLifecycleOracleParityTest
