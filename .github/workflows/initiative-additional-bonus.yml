name: Initiative Additional Bonus Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-initiative-additional-bonus:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Validate exporter
        run: python3 -m py_compile tools/python/export_initiative_additional_bonus_fixtures.py

      - name: Export pinned Python fixtures
        run: python3 tools/python/export_initiative_additional_bonus_fixtures.py --source-root python-oracle --output build/oracle/initiative-additional-bonus.tsv

      - name: Run Java tests with initiative parity fixture
        run: >-
          gradle test --stacktrace
          -PoracleInitiativeAdditionalBonus="$GITHUB_WORKSPACE/build/oracle/initiative-additional-bonus.tsv"
