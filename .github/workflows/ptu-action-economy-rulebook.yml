name: PTU Action Economy Rulebook Conformance

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  action-economy:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Run direct PTU action-economy rules
        run: >-
          gradle test --stacktrace
          --tests io.autoptu.core.rules.ActionBudgetRulebookConformanceTest
          --tests io.autoptu.core.rules.TurnFlowTest
          --tests io.autoptu.core.rules.AutobattlerActionSpaceTest
          --tests io.autoptu.core.rules.ShiftApplicationTest
