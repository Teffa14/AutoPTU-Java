name: Intercept Resource Contract

on:
  pull_request:
    paths:
      - "tools/python/export_intercept_resource_contract.py"
      - ".github/workflows/intercept-resource-contract.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Export Python intercept resource contract
        run: |
          python3 -m py_compile tools/python/export_intercept_resource_contract.py
          python3 tools/python/export_intercept_resource_contract.py \
            --source-root python-oracle \
            --output build/oracle/intercept-resource.tsv
          cat build/oracle/intercept-resource.tsv
