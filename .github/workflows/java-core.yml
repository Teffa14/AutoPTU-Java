name: Java Core Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-java-core:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Validate Python migration tools
        run: |
          python3 -m py_compile tools/python/export_runtime_types.py
          python3 -m py_compile tools/python/export_targeting_fixtures.py
          python3 -m py_compile tools/python/export_movement_fixtures.py
          python3 -m py_compile tools/python/export_calculation_fixtures.py
          python3 -m py_compile tools/python/export_ptu_table_fixtures.py
          python3 -m py_compile tools/python/export_turnflow_fixtures.py
          python3 -m py_compile tools/python/export_jump_fixtures.py
          python3 -m py_compile tools/python/export_accuracy_fixtures.py
          python3 -m py_compile tools/python/export_stat_resolution_fixtures.py
          python3 -m py_compile tools/python/export_action_space_fixtures.py
          python3 -m py_compile tools/python/export_damage_fixtures.py
          python3 -m py_compile tools/python/export_move_event_fixtures.py
          python3 -m py_compile tools/python/export_shift_application_fixtures.py
          python3 -m py_compile tools/python/export_move_combat_profile_fixtures.py

      - name: Export Python oracle fixtures
        run: |
          python3 tools/python/export_targeting_fixtures.py --source-root python-oracle --output build/oracle/targeting.tsv
          python3 tools/python/export_movement_fixtures.py --source-root python-oracle --output build/oracle/movement.tsv
          python3 tools/python/export_calculation_fixtures.py --source-root python-oracle --output build/oracle/calculations.tsv
          python3 tools/python/export_ptu_table_fixtures.py --source-root python-oracle --output build/oracle/ptu-tables.tsv
          python3 tools/python/export_turnflow_fixtures.py --source-root python-oracle --output build/oracle/turnflow.tsv
          python3 tools/python/export_jump_fixtures.py --source-root python-oracle --output build/oracle/jump.tsv
          python3 tools/python/export_accuracy_fixtures.py --source-root python-oracle --output build/oracle/accuracy.tsv
          python3 tools/python/export_stat_resolution_fixtures.py --source-root python-oracle --output build/oracle/stats.tsv
          python3 tools/python/export_action_space_fixtures.py --source-root python-oracle --output build/oracle/action-space.tsv
          python3 tools/python/export_damage_fixtures.py --source-root python-oracle --output build/oracle/damage.tsv
          python3 tools/python/export_move_event_fixtures.py --source-root python-oracle --output build/oracle/move-events.tsv
          python3 tools/python/export_shift_application_fixtures.py --source-root python-oracle --output build/oracle/shift-application.tsv
          python3 tools/python/export_move_combat_profile_fixtures.py --source-root python-oracle --output build/oracle/move-combat-profile.tsv

      - name: Run Java core and Python-oracle parity tests
        run: >-
          gradle test --stacktrace
          -PoracleTargeting="$GITHUB_WORKSPACE/build/oracle/targeting.tsv"
          -PoracleMovement="$GITHUB_WORKSPACE/build/oracle/movement.tsv"
          -PoracleCalculations="$GITHUB_WORKSPACE/build/oracle/calculations.tsv"
          -PoraclePtuTables="$GITHUB_WORKSPACE/build/oracle/ptu-tables.tsv"
          -PoracleTurnFlow="$GITHUB_WORKSPACE/build/oracle/turnflow.tsv"
          -PoracleJump="$GITHUB_WORKSPACE/build/oracle/jump.tsv"
          -PoracleAccuracy="$GITHUB_WORKSPACE/build/oracle/accuracy.tsv"
          -PoracleStats="$GITHUB_WORKSPACE/build/oracle/stats.tsv"
          -PoracleActionSpace="$GITHUB_WORKSPACE/build/oracle/action-space.tsv"
          -PoracleDamage="$GITHUB_WORKSPACE/build/oracle/damage.tsv"
          -PoracleMoveEvents="$GITHUB_WORKSPACE/build/oracle/move-events.tsv"
          -PoracleShiftApplication="$GITHUB_WORKSPACE/build/oracle/shift-application.tsv"
          -PoracleMoveCombatProfile="$GITHUB_WORKSPACE/build/oracle/move-combat-profile.tsv"
