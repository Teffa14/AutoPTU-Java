name: Intercept Movement Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/runtime/InterceptMovementApplication.java"
      - "src/test/java/io/autoptu/core/runtime/InterceptMovementApplicationTest.java"
      - "src/test/java/io/autoptu/core/runtime/InterceptMovementOracleParityTest.java"
      - "tools/python/export_intercept_movement_contract.py"
      - ".github/workflows/intercept-movement-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python intercept movement contract
        run: |
          python3 -m py_compile tools/python/export_intercept_movement_contract.py
          python3 tools/python/export_intercept_movement_contract.py \
            --source-root python-oracle \
            --output build/oracle/intercept-movement.tsv

      - name: Run intercept movement parity tests
        run: >-
          gradle test --stacktrace
          -Dautoptu.intercept.movement.oracle="$GITHUB_WORKSPACE/build/oracle/intercept-movement.tsv"
          --tests io.autoptu.core.runtime.InterceptMovementOracleParityTest
          --tests io.autoptu.core.runtime.InterceptMovementApplicationTest
