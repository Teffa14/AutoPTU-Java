name: Move Special Secondary Status Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  move-special-secondary-status-parity:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export secondary status oracle fixtures
        run: |
          python3 -m py_compile tools/python/export_move_special_secondary_status_fixtures.py
          python3 tools/python/export_move_special_secondary_status_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/move-special-secondary-status.tsv

      - name: Run secondary status parity regression
        run: >-
          gradle test --stacktrace
          --tests io.autoptu.core.hook.MoveSpecialSecondaryStatusOracleParityTest
          --tests io.autoptu.core.runtime.MoveSpecialSecondaryStatusApplicationTest
          --tests io.autoptu.core.runtime.MoveSpecialSecondaryStatusPostDamageTest
          --tests io.autoptu.core.runtime.RuntimeMoveSpecialSecondaryStatusIntegrationTest
          -Dautoptu.move.special.secondary.status.oracle=build/oracle/move-special-secondary-status.tsv
