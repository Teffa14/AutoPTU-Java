name: Tile Entry Trap Parity

on:
  pull_request:
    paths:
      - 'src/main/java/io/autoptu/core/runtime/TileEntryTrapResolution.java'
      - 'src/test/java/io/autoptu/core/runtime/TileEntryTrapResolutionTest.java'
      - 'src/test/java/io/autoptu/core/runtime/TileEntryTrapOracleContractTest.java'
      - 'tools/python/export_tile_entry_trap_contract.py'
      - '.github/workflows/tile-entry-trap-parity.yml'
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python tile-entry trap contract
        run: |
          python3 -m py_compile tools/python/export_tile_entry_trap_contract.py
          python3 tools/python/export_tile_entry_trap_contract.py \
            --source-root python-oracle \
            --output build/oracle/tile-entry-trap.tsv
          cat build/oracle/tile-entry-trap.tsv

      - name: Run tile-entry trap parity tests
        env:
          AUTOPTU_TILE_ENTRY_TRAP_ORACLE: ${{ github.workspace }}/build/oracle/tile-entry-trap.tsv
        run: >-
          gradle test --stacktrace
          --tests io.autoptu.core.runtime.TileEntryTrapResolutionTest
          --tests io.autoptu.core.runtime.TileEntryTrapOracleContractTest
