name: Move Special POST Damage Contract

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Java port
        uses: actions/checkout@v4

      - name: Checkout pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export POST-damage move-special contract
        run: >-
          python3 tools/python/export_move_special_post_damage_contract.py
          --source-root python-oracle
          --output build/oracle/move-special-post-damage.tsv

      - name: Test POST-damage move-special bridge and runtime timing
        run: |
          gradle test --tests io.autoptu.core.hook.MoveSpecialPostDamageResolutionTest
          gradle test --tests io.autoptu.core.runtime.RuntimeMoveSpecialPostDamageApplicationTest
          gradle test --tests io.autoptu.core.runtime.MoveSpecialReactionHandoffTest
