name: Combatant Switch Entry State Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  combatant-switch-entry-state:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze Python switch entry state
        run: |
          python3 -m py_compile tools/python/export_switch_entry_state_fixture.py
          python3 tools/python/export_switch_entry_state_fixture.py \
            --source-root python-oracle \
            --output build/oracle/switch-entry-state.tsv
          cat build/oracle/switch-entry-state.tsv
          python3 -m py_compile tools/python/export_switch_execution_order_fixture.py
          python3 tools/python/export_switch_execution_order_fixture.py \
            --source-root python-oracle \
            --output build/oracle/switch-execution-order.tsv
          cat build/oracle/switch-execution-order.tsv
          python3 -m py_compile tools/python/export_switch_post_entry_calls.py
          python3 tools/python/export_switch_post_entry_calls.py \
            --source-root python-oracle \
            --output build/oracle/switch-post-entry-calls.tsv
          cat build/oracle/switch-post-entry-calls.tsv
          python3 -m py_compile tools/python/export_ball_fetch_switch_fixture.py
          python3 tools/python/export_ball_fetch_switch_fixture.py \
            --source-root python-oracle \
            --output build/oracle/ball-fetch-switch.tsv
          cat build/oracle/ball-fetch-switch.tsv

      - name: Compare Java switch entry state
        run: |
          gradle test --stacktrace \
            --tests io.autoptu.core.runtime.CombatantSwitchTransitionPlanOracleParityTest \
            --tests io.autoptu.core.runtime.CombatantSwitchEntryStatePlanOracleParityTest \
            --tests io.autoptu.core.runtime.CombatantFieldPresenceStoreOracleParityTest \
            --tests io.autoptu.core.runtime.CombatantSwitchExecutionPlanOracleParityTest \
            --tests io.autoptu.core.runtime.CombatantSwitchExecutorOracleParityTest \
            --tests io.autoptu.core.runtime.CombatantSwitchPostEntryPlanOracleParityTest \
            --tests io.autoptu.core.runtime.CombatantSwitchPostEntryDispatcherOracleParityTest \
            --tests io.autoptu.core.runtime.RuntimeApproachShiftDestinationResolverOracleParityTest \
            --tests io.autoptu.core.runtime.AbilityApproachShiftExecutorOracleParityTest \
            --tests io.autoptu.core.runtime.ImpostorSwitchEntryOracleParityTest
