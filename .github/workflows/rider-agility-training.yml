name: Rider Agility Training Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rider-agility-training-parity:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Rider Agility Training oracle fixtures
        run: |
          python3 -m py_compile tools/python/export_rider_agility_training_fixtures.py
          python3 tools/python/export_rider_agility_training_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/rider-agility-training.tsv

      - name: Run Rider Agility Training parity and Java regression suite
        env:
          JAVA_TOOL_OPTIONS: -Dautoptu.rider.agility.oracle=${{ github.workspace }}/build/oracle/rider-agility-training.tsv
        run: gradle test --stacktrace
