name: Reaction Escape Movement Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/rules/ReactionEscapeMovementResolution.java"
      - "src/test/java/io/autoptu/core/rules/ReactionEscapeMovementOracleParityTest.java"
      - "tools/python/export_reaction_escape_movement_fixtures.py"
      - ".github/workflows/reaction-escape-movement-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python oracle fixture
        run: |
          python3 -m py_compile tools/python/export_reaction_escape_movement_fixtures.py
          python3 tools/python/export_reaction_escape_movement_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/reaction-escape-movement.tsv

      - name: Run reaction escape movement parity
        env:
          AUTOPTU_REACTION_ESCAPE_MOVEMENT_ORACLE: ${{ github.workspace }}/build/oracle/reaction-escape-movement.tsv
        run: gradle test --tests io.autoptu.core.rules.ReactionEscapeMovementOracleParityTest --stacktrace
