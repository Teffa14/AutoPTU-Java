name: Forced Movement Instruction Parity

on:
  pull_request:
    paths:
      - "src/main/java/**/*.java"
      - "src/test/java/io/autoptu/core/rules/ForcedMovementInstructionOracleParityTest.java"
      - "src/test/java/io/autoptu/core/rules/ForcedMovementAbilityModifierOracleParityTest.java"
      - "src/test/java/io/autoptu/core/rules/ForcedMovementPreventionOracleParityTest.java"
      - "src/test/java/io/autoptu/core/rules/ForcedMovementStatePreventionOracleParityTest.java"
      - "src/test/java/io/autoptu/core/runtime/ForcedDisplacementResolutionTest.java"
      - "src/test/java/io/autoptu/core/runtime/ForcedMovementApplicationTest.java"
      - "src/test/java/io/autoptu/core/runtime/ForcedMovementShadowAnchorExecutionOracleParityTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeForcedMovementMoveApplicationTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeForcedMovementAbilityModifierTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimePostHitForcedMovementApplicationTest.java"
      - "src/test/java/io/autoptu/core/runtime/BattleRuntimeAuthoritativeMoveTest.java"
      - "src/test/java/io/autoptu/core/runtime/ForcedMovementRuntimeBindingContractTest.java"
      - "src/test/java/io/autoptu/core/runtime/ForcedMovementObservableOracleContractTest.java"
      - "src/test/java/io/autoptu/core/runtime/ForcedMovementShadowAnchorOracleContractTest.java"
      - "src/test/java/io/autoptu/core/runtime/CombatantDistanceOracleContractTest.java"
      - "src/test/java/io/autoptu/core/runtime/FootprintDistanceOracleContractTest.java"
      - "tools/python/export_forced_movement_instruction_fixtures.py"
      - "tools/python/export_forced_movement_ability_modifier_fixtures.py"
      - "tools/python/export_forced_movement_prevention_fixtures.py"
      - "tools/python/export_forced_movement_state_prevention_fixtures.py"
      - "tools/python/export_forced_movement_runtime_binding_contract.py"
      - "tools/python/export_forced_movement_observable_contract.py"
      - "tools/python/export_forced_movement_shadow_anchor_contract.py"
      - "tools/python/export_forced_movement_shadow_anchor_execution_fixtures.py"
      - "tools/python/export_combatant_distance_contract.py"
      - "tools/python/export_footprint_distance_contract.py"
      - ".github/workflows/forced-movement-instruction-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python oracle fixtures
        run: |
          python3 -m py_compile tools/python/export_forced_movement_instruction_fixtures.py
          python3 -m py_compile tools/python/export_forced_movement_ability_modifier_fixtures.py
          python3 -m py_compile tools/python/export_forced_movement_prevention_fixtures.py
          python3 -m py_compile tools/python/export_forced_movement_state_prevention_fixtures.py
          python3 -m py_compile tools/python/export_forced_movement_runtime_binding_contract.py
          python3 -m py_compile tools/python/export_forced_movement_observable_contract.py
          python3 -m py_compile tools/python/export_forced_movement_shadow_anchor_contract.py
          python3 -m py_compile tools/python/export_forced_movement_shadow_anchor_execution_fixtures.py
          python3 -m py_compile tools/python/export_combatant_distance_contract.py
          python3 -m py_compile tools/python/export_footprint_distance_contract.py
          python3 tools/python/export_forced_movement_instruction_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-instruction.tsv
          python3 tools/python/export_forced_movement_ability_modifier_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-ability-modifier.tsv
          python3 tools/python/export_forced_movement_prevention_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-prevention.tsv
          python3 tools/python/export_forced_movement_state_prevention_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-state-prevention.tsv
          python3 tools/python/export_forced_movement_runtime_binding_contract.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-runtime-binding.tsv \
            --trace-output build/oracle/forced-movement-runtime-trace.tsv \
            --consumer-output build/oracle/forced-movement-runtime-consumer.tsv
          python3 tools/python/export_forced_movement_observable_contract.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-observable.tsv
          python3 tools/python/export_forced_movement_shadow_anchor_contract.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-shadow-anchor.tsv
          python3 tools/python/export_forced_movement_shadow_anchor_execution_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/forced-movement-shadow-anchor-execution.tsv
          python3 tools/python/export_combatant_distance_contract.py \
            --source-root python-oracle \
            --output build/oracle/combatant-distance.tsv
          python3 tools/python/export_footprint_distance_contract.py \
            --source-root python-oracle \
            --output build/oracle/footprint-distance.tsv
          cat build/oracle/forced-movement-prevention.tsv
          cat build/oracle/forced-movement-state-prevention.tsv
          cat build/oracle/forced-movement-runtime-binding.tsv
          cat build/oracle/forced-movement-runtime-trace.tsv
          cat build/oracle/forced-movement-runtime-consumer.tsv
          cat build/oracle/forced-movement-observable.tsv
          cat build/oracle/forced-movement-shadow-anchor.tsv
          cat build/oracle/forced-movement-shadow-anchor-execution.tsv
          cat build/oracle/combatant-distance.tsv
          cat build/oracle/footprint-distance.tsv

      - name: Run forced movement instruction and displacement tests
        env:
          AUTOPTU_FORCED_MOVEMENT_INSTRUCTION_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-instruction.tsv
          AUTOPTU_FORCED_MOVEMENT_ABILITY_MODIFIER_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-ability-modifier.tsv
          AUTOPTU_FORCED_MOVEMENT_PREVENTION_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-prevention.tsv
          AUTOPTU_FORCED_MOVEMENT_STATE_PREVENTION_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-state-prevention.tsv
          AUTOPTU_FORCED_MOVEMENT_RUNTIME_BINDING_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-runtime-binding.tsv
          AUTOPTU_FORCED_MOVEMENT_RUNTIME_CONSUMER_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-runtime-consumer.tsv
          AUTOPTU_FORCED_MOVEMENT_OBSERVABLE_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-observable.tsv
          AUTOPTU_FORCED_MOVEMENT_SHADOW_ANCHOR_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-shadow-anchor.tsv
          AUTOPTU_FORCED_MOVEMENT_SHADOW_ANCHOR_EXECUTION_ORACLE: ${{ github.workspace }}/build/oracle/forced-movement-shadow-anchor-execution.tsv
          AUTOPTU_COMBATANT_DISTANCE_ORACLE: ${{ github.workspace }}/build/oracle/combatant-distance.tsv
          AUTOPTU_FOOTPRINT_DISTANCE_ORACLE: ${{ github.workspace }}/build/oracle/footprint-distance.tsv
        run: >-
          gradle test --stacktrace
          --tests io.autoptu.core.rules.ForcedMovementInstructionOracleParityTest
          --tests io.autoptu.core.rules.ForcedMovementAbilityModifierOracleParityTest
          --tests io.autoptu.core.rules.ForcedMovementPreventionOracleParityTest
          --tests io.autoptu.core.rules.ForcedMovementStatePreventionOracleParityTest
          --tests io.autoptu.core.runtime.ForcedDisplacementResolutionTest
          --tests io.autoptu.core.runtime.ForcedMovementApplicationTest
          --tests io.autoptu.core.runtime.ForcedMovementShadowAnchorExecutionOracleParityTest
          --tests io.autoptu.core.runtime.RuntimeForcedMovementMoveApplicationTest
          --tests io.autoptu.core.runtime.RuntimeForcedMovementAbilityModifierTest
          --tests io.autoptu.core.runtime.RuntimePostHitForcedMovementApplicationTest
          --tests io.autoptu.core.runtime.BattleRuntimeAuthoritativeMoveTest
          --tests io.autoptu.core.runtime.ForcedMovementRuntimeBindingContractTest
          --tests io.autoptu.core.runtime.ForcedMovementObservableOracleContractTest
          --tests io.autoptu.core.runtime.ForcedMovementShadowAnchorOracleContractTest
          --tests io.autoptu.core.runtime.CombatantDistanceOracleContractTest
          --tests io.autoptu.core.runtime.FootprintDistanceOracleContractTest
