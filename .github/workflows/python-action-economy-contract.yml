name: Python Action Economy Contract

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-action-economy-contract:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Freeze Python action economy boundary
        run: |
          python3 tools/python/export_action_economy_contract.py \
            --source-root python-oracle \
            --output build/oracle/action-economy-contract.tsv
          cat build/oracle/action-economy-contract.tsv

      - name: Verify Python-compatible consumption contract
        run: |
          grep -Fx $'CONSUMPTION\ttrainer\tcheck\trequested_action_type' build/oracle/action-economy-contract.tsv
          grep -Fx $'CONSUMPTION\ttrainer\tmark\trequested_action_type' build/oracle/action-economy-contract.tsv
          grep -Fx $'CONSUMPTION\tpokemon\tcheck\trequested_action_type' build/oracle/action-economy-contract.tsv
          grep -Fx $'CONSUMPTION\tpokemon\textra_fallback\trequested_action_type' build/oracle/action-economy-contract.tsv
          grep -Fx $'CONSUMPTION\tpokemon\tmark\trequested_action_type' build/oracle/action-economy-contract.tsv
          grep -Fx $'RESOLVER_SPECIAL_CASE\tfull_composition\tfalse\tresolve_next_action' build/oracle/action-economy-contract.tsv
          grep -Fx $'RESOLVER_SPECIAL_CASE\tstandard_conversion\tfalse\tresolve_next_action' build/oracle/action-economy-contract.tsv
