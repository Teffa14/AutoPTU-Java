name: Shift Position Fit Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/runtime/RuntimePositionFitResolver.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeShiftDestinationResolver.java"
      - "src/main/java/io/autoptu/core/model/MovementGrid.java"
      - "src/main/java/io/autoptu/core/runtime/BattleRuntimeState.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeCombatantState.java"
      - "src/main/java/io/autoptu/core/runtime/CombatantGeometryState.java"
      - "src/main/java/io/autoptu/core/rules/Movement.java"
      - "src/main/java/io/autoptu/core/rules/Targeting.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeShiftDestinationResolverTest.java"
      - "tools/python/export_shift_position_fit_contract.py"
      - ".github/workflows/shift-position-fit-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze Python Shift position-fit contract
        run: |
          python3 -m py_compile tools/python/export_shift_position_fit_contract.py
          python3 tools/python/export_shift_position_fit_contract.py \
            --source-root python-oracle \
            --output build/oracle/shift-position-fit.tsv
          cat build/oracle/shift-position-fit.tsv

      - name: Run Java Shift position-fit tests
        run: >-
          gradle test --stacktrace
          --tests io.autoptu.core.runtime.RuntimeShiftDestinationResolverTest
