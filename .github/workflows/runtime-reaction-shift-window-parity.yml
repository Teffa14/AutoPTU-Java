name: Runtime Reaction Shift Window Parity

on:
  push:
    branches:
      - main
    paths:
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionWindowResolver.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionTriggerMatcher.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionEligibilityResolver.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionOwnershipResolver.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionUsageTracker.java"
      - "src/main/java/io/autoptu/core/runtime/BattleRuntimeState.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeReactionWindowResolverTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeReactionShiftWindowOracleParityTest.java"
      - "tools/python/export_attack_of_opportunity_shift_window_fixture.py"
      - ".github/workflows/runtime-reaction-shift-window-parity.yml"
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionWindowResolver.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionTriggerMatcher.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionEligibilityResolver.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionOwnershipResolver.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeReactionUsageTracker.java"
      - "src/main/java/io/autoptu/core/runtime/BattleRuntimeState.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeReactionWindowResolverTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeReactionShiftWindowOracleParityTest.java"
      - "tools/python/export_attack_of_opportunity_shift_window_fixture.py"
      - ".github/workflows/runtime-reaction-shift-window-parity.yml"

jobs:
  runtime-reaction-shift-window-parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4
      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle
      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version
      - name: Freeze pinned Python Shift-window fixture
        run: >-
          python tools/python/export_attack_of_opportunity_shift_window_fixture.py
          --source-root python-oracle
          --output build/reaction-shift-window-oracle.tsv
      - name: Run Shift-window unit and oracle parity tests
        env:
          AUTOPTU_REACTION_SHIFT_WINDOW_ORACLE: ${{ github.workspace }}/build/reaction-shift-window-oracle.tsv
        run: >-
          gradle test --stacktrace
          --tests io.autoptu.core.runtime.RuntimeReactionWindowResolverTest
          --tests io.autoptu.core.runtime.RuntimeReactionShiftWindowOracleParityTest
