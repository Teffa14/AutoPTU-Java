name: Intercept Check Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/runtime/InterceptCheckResolution.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeInterceptCheckApplication.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeInterceptCheckInputFactory.java"
      - "src/main/java/io/autoptu/core/runtime/CombatantRuleContent.java"
      - "src/main/java/io/autoptu/core/runtime/RuntimeCombatantState.java"
      - "src/main/java/io/autoptu/core/runtime/TemporaryEffectStore.java"
      - "src/test/java/io/autoptu/core/runtime/InterceptCheckResolutionTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeInterceptServerOwnedSkillInputTest.java"
      - "src/test/java/io/autoptu/core/runtime/RuntimeInterceptCheckInputFactoryTest.java"
      - "tools/python/export_intercept_check_contract.py"
      - "tools/python/test_export_intercept_check_contract.py"
      - ".github/workflows/intercept-check-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python intercept check contract
        run: |
          python3 -m py_compile tools/python/export_intercept_check_contract.py tools/python/test_export_intercept_check_contract.py
          python3 tools/python/test_export_intercept_check_contract.py
          python3 tools/python/export_intercept_check_contract.py \
            --source-root python-oracle \
            --output build/oracle/intercept-check.tsv \
            --terrain-output build/oracle/intercept-terrain-contract.tsv
          cat build/oracle/intercept-terrain-contract.tsv

      - name: Run intercept check parity tests
        run: >-
          gradle test --stacktrace
          -Dautoptu.intercept.check.oracle="$GITHUB_WORKSPACE/build/oracle/intercept-check.tsv"
          --tests io.autoptu.core.runtime.InterceptCheckResolutionTest
          --tests io.autoptu.core.runtime.RuntimeInterceptServerOwnedSkillInputTest
          --tests io.autoptu.core.runtime.RuntimeInterceptCheckInputFactoryTest
