name: Combat Stage Accuracy Evasion Parity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze Python Accuracy/Evasion Combat Stage contract
        run: |
          python3 -m py_compile \
            tools/python/export_combat_stage_accuracy_evasion_contract.py \
            tools/python/export_temporary_accuracy_bonus_fixtures.py \
            tools/python/export_accuracy_helper_contract.py \
            tools/python/export_chronicler_profile_metadata_contract.py
          python3 tools/python/export_combat_stage_accuracy_evasion_contract.py \
            --source-root python-oracle \
            --output build/oracle/combat-stage-accuracy-evasion.tsv
          python3 tools/python/export_temporary_accuracy_bonus_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/temporary-accuracy-bonus.tsv
          python3 tools/python/export_accuracy_helper_contract.py \
            --source-root python-oracle \
            --output build/oracle/accuracy-helper-contract.tsv
          python3 tools/python/export_chronicler_profile_metadata_contract.py \
            --source-root python-oracle \
            --output build/oracle/chronicler-profile-metadata.tsv

      - name: Run Accuracy/Evasion Combat Stage parity tests
        env:
          AUTOPTU_COMBAT_STAGE_ACCURACY_EVASION_ORACLE: ${{ github.workspace }}/build/oracle/combat-stage-accuracy-evasion.tsv
          AUTOPTU_TEMPORARY_ACCURACY_BONUS_ORACLE: ${{ github.workspace }}/build/oracle/temporary-accuracy-bonus.tsv
          AUTOPTU_ACCURACY_HELPER_CONTRACT_ORACLE: ${{ github.workspace }}/build/oracle/accuracy-helper-contract.tsv
          AUTOPTU_CHRONICLER_PROFILE_METADATA_ORACLE: ${{ github.workspace }}/build/oracle/chronicler-profile-metadata.tsv
        run: |
          gradle test --stacktrace \
            --tests io.autoptu.core.runtime.CombatStageAccuracyEvasionOracleParityTest \
            --tests io.autoptu.core.runtime.CombatStageStateSevenStatTest \
            --tests io.autoptu.core.runtime.EffectiveAccuracyStageProjectionTest \
            --tests io.autoptu.core.runtime.CombatantIntrinsicAccuracyProfileTest \
            --tests io.autoptu.core.runtime.TemporaryAccuracyBonusOracleParityTest \
            --tests io.autoptu.core.runtime.RuntimeTemporaryAccuracyBonusInputsTest \
            --tests io.autoptu.core.runtime.RuntimeChroniclerAccuracyBonusInputsTest \
            --tests io.autoptu.core.runtime.RuntimeEffectiveAccuracyPreparationTest \
            --tests io.autoptu.core.runtime.AccuracyHelperContractOracleParityTest \
            --tests io.autoptu.core.runtime.FocusedTrainingAccuracyBonusOracleParityTest \
            --tests io.autoptu.core.runtime.FocusedTrainingAccuracyRuntimeInputsTest \
            --tests io.autoptu.core.runtime.ChroniclerProfileMetadataOracleParityTest \
            --tests io.autoptu.core.runtime.MoveSpecialSecondaryCombatStageApplicationTest \
            --tests io.autoptu.core.runtime.MirrorArmorCombatStageOracleParityTest
