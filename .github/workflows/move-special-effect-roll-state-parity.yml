name: Move Special Effect Roll State Parity

on:
  push:
    branches:
      - main
      - 'port/**'
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Java port
        uses: actions/checkout@v4

      - name: Checkout pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: AutoPTU-python

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export pinned Python effect-roll state fixtures
        run: >-
          python3 tools/python/export_move_special_effect_roll_state_fixtures.py
          --source-root AutoPTU-python
          --output build/oracle/move-special-effect-roll-state.tsv

      - name: Run move-special effect-roll state parity
        run: >-
          gradle test
          --tests io.autoptu.core.hook.MoveSpecialEffectRollTemporaryStateOracleParityTest
          -Dautoptu.move.special.effect.roll.state.oracle=build/oracle/move-special-effect-roll-state.tsv
