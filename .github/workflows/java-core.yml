name: Java Core Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-java-core:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Validate Python migration tools
        run: |
          python3 -m py_compile tools/python/export_runtime_types.py
          python3 -m py_compile tools/python/export_targeting_fixtures.py
          python3 -m py_compile tools/python/export_movement_fixtures.py
          python3 -m py_compile tools/python/export_calculation_fixtures.py
          python3 -m py_compile tools/python/export_ptu_table_fixtures.py
          python3 -m py_compile tools/python/export_turnflow_fixtures.py
          python3 -m py_compile tools/python/export_jump_fixtures.py
          python3 -m py_compile tools/python/export_accuracy_fixtures.py
          python3 -m py_compile tools/python/export_stat_resolution_fixtures.py
          python3 -m py_compile tools/python/export_action_space_fixtures.py
          python3 -m py_compile tools/python/export_damage_fixtures.py
          python3 -m py_compile tools/python/export_move_event_fixtures.py
          python3 -m py_compile tools/python/export_shift_application_fixtures.py
          python3 -m py_compile tools/python/export_move_combat_profile_fixtures.py
          python3 -m py_compile tools/python/export_evasion_fixtures.py
          python3 -m py_compile tools/python/export_stab_fixtures.py
          python3 -m py_compile tools/python/export_burn_damage_fixtures.py
          python3 -m py_compile tools/python/export_status_skip_fixtures.py
          python3 -m py_compile tools/python/export_status_skip_exception_fixtures.py
          python3 -m py_compile tools/python/export_move_frequency_fixtures.py
          python3 -m py_compile tools/python/export_round_lifecycle_fixtures.py
          python3 -m py_compile tools/python/export_phase_lifecycle_fixtures.py
          python3 -m py_compile tools/python/export_pink_pearl_fixtures.py
          python3 -m py_compile tools/python/export_mega_launcher_fixtures.py
          python3 -m py_compile tools/python/export_temporary_effect_payload_fixtures.py
          python3 -m py_compile tools/python/export_delayed_hit_fixtures.py
          python3 -m py_compile tools/python/export_damage_history_fixtures.py
          python3 -m py_compile tools/python/export_status_application_fixtures.py
          python3 -m py_compile tools/python/export_lancer_phase_fixtures.py
          python3 -m py_compile tools/python/export_perk_phase_registry_fixtures.py
          python3 -m py_compile tools/python/export_combat_stage_hook_fixtures.py
          python3 -m py_compile tools/python/export_spatial_damage_aura_fixtures.py
          python3 -m py_compile tools/python/export_move_keyword_fixtures.py
          python3 -m py_compile tools/python/export_analytic_fixtures.py
          python3 -m py_compile tools/python/export_initiative_turn_fixtures.py
          python3 -m py_compile tools/python/export_pokemon_initiative_entry_fixtures.py
          python3 -m py_compile tools/python/export_initiative_round_modifier_fixtures.py
          python3 -m py_compile tools/python/export_initiative_speed_ability_fixtures.py

      - name: Export Python oracle fixtures
        run: |
          python3 tools/python/export_targeting_fixtures.py --source-root python-oracle --output build/oracle/targeting.tsv
          python3 tools/python/export_movement_fixtures.py --source-root python-oracle --output build/oracle/movement.tsv
          python3 tools/python/export_calculation_fixtures.py --source-root python-oracle --output build/oracle/calculations.tsv
          python3 tools/python/export_ptu_table_fixtures.py --source-root python-oracle --output build/oracle/ptu-tables.tsv
          python3 tools/python/export_turnflow_fixtures.py --source-root python-oracle --output build/oracle/turnflow.tsv
          python3 tools/python/export_jump_fixtures.py --source-root python-oracle --output build/oracle/jump.tsv
          python3 tools/python/export_accuracy_fixtures.py --source-root python-oracle --output build/oracle/accuracy.tsv
          python3 tools/python/export_stat_resolution_fixtures.py --source-root python-oracle --output build/oracle/stats.tsv
          python3 tools/python/export_action_space_fixtures.py --source-root python-oracle --output build/oracle/action-space.tsv
          python3 tools/python/export_damage_fixtures.py --source-root python-oracle --output build/oracle/damage.tsv
          python3 tools/python/export_move_event_fixtures.py --source-root python-oracle --output build/oracle/move-events.tsv
          python3 tools/python/export_shift_application_fixtures.py --source-root python-oracle --output build/oracle/shift-application.tsv
          python3 tools/python/export_move_combat_profile_fixtures.py --source-root python-oracle --output build/oracle/move-combat-profile.tsv
          python3 tools/python/export_evasion_fixtures.py --source-root python-oracle --output build/oracle/evasion.tsv
          python3 tools/python/export_stab_fixtures.py --source-root python-oracle --output build/oracle/stab.tsv
          python3 tools/python/export_burn_damage_fixtures.py --source-root python-oracle --output build/oracle/burn-damage.tsv
          python3 tools/python/export_status_skip_fixtures.py --source-root python-oracle --output build/oracle/status-skip.tsv
          python3 tools/python/export_status_skip_exception_fixtures.py --source-root python-oracle --output build/oracle/status-skip-exceptions.tsv
          python3 tools/python/export_move_frequency_fixtures.py --source-root python-oracle --output build/oracle/move-frequency.tsv
          python3 tools/python/export_round_lifecycle_fixtures.py --source-root python-oracle --output build/oracle/round-lifecycle.tsv
          python3 tools/python/export_phase_lifecycle_fixtures.py --source-root python-oracle --output build/oracle/phase-lifecycle.tsv
          python3 tools/python/export_pink_pearl_fixtures.py --source-root python-oracle --output build/oracle/pink-pearl.tsv
          python3 tools/python/export_mega_launcher_fixtures.py --source-root python-oracle --output build/oracle/mega-launcher.tsv
          python3 tools/python/export_temporary_effect_payload_fixtures.py --source-root python-oracle --output build/oracle/temporary-effect-payload.tsv
          python3 tools/python/export_delayed_hit_fixtures.py --source-root python-oracle --output build/oracle/delayed-hit.tsv
          python3 tools/python/export_damage_history_fixtures.py --source-root python-oracle --output build/oracle/damage-history.tsv
          python3 tools/python/export_status_application_fixtures.py --source-root python-oracle --output build/oracle/status-application.tsv
          python3 tools/python/export_lancer_phase_fixtures.py --source-root python-oracle --output build/oracle/lancer-phase.tsv
          python3 tools/python/export_perk_phase_registry_fixtures.py --source-root python-oracle --output build/oracle/perk-phase.tsv
          python3 tools/python/export_combat_stage_hook_fixtures.py --source-root python-oracle --output build/oracle/combat-stage-hooks.tsv
          python3 tools/python/export_spatial_damage_aura_fixtures.py --source-root python-oracle --output build/oracle/spatial-damage-auras.tsv
          python3 tools/python/export_move_keyword_fixtures.py --source-root python-oracle --output build/oracle/move-keywords.tsv
          python3 tools/python/export_analytic_fixtures.py --source-root python-oracle --output build/oracle/analytic.tsv
          python3 tools/python/export_initiative_turn_fixtures.py --source-root python-oracle --output build/oracle/initiative-turn.tsv
          python3 tools/python/export_pokemon_initiative_entry_fixtures.py --source-root python-oracle --output build/oracle/pokemon-initiative-entry.tsv
          python3 tools/python/export_initiative_round_modifier_fixtures.py --source-root python-oracle --output build/oracle/initiative-round-modifier.tsv
          python3 tools/python/export_initiative_speed_ability_fixtures.py --source-root python-oracle --output build/oracle/initiative-speed-ability.tsv

      - name: Run Java core and Python-oracle parity tests
        run: >-
          gradle test --stacktrace
          -PoracleTargeting="$GITHUB_WORKSPACE/build/oracle/targeting.tsv"
          -PoracleMovement="$GITHUB_WORKSPACE/build/oracle/movement.tsv"
          -PoracleCalculations="$GITHUB_WORKSPACE/build/oracle/calculations.tsv"
          -PoraclePtuTables="$GITHUB_WORKSPACE/build/oracle/ptu-tables.tsv"
          -PoracleTurnFlow="$GITHUB_WORKSPACE/build/oracle/turnflow.tsv"
          -PoracleJump="$GITHUB_WORKSPACE/build/oracle/jump.tsv"
          -PoracleAccuracy="$GITHUB_WORKSPACE/build/oracle/accuracy.tsv"
          -PoracleStats="$GITHUB_WORKSPACE/build/oracle/stats.tsv"
          -PoracleActionSpace="$GITHUB_WORKSPACE/build/oracle/action-space.tsv"
          -PoracleDamage="$GITHUB_WORKSPACE/build/oracle/damage.tsv"
          -PoracleMoveEvents="$GITHUB_WORKSPACE/build/oracle/move-events.tsv"
          -PoracleShiftApplication="$GITHUB_WORKSPACE/build/oracle/shift-application.tsv"
          -PoracleMoveCombatProfile="$GITHUB_WORKSPACE/build/oracle/move-combat-profile.tsv"
          -PoracleEvasion="$GITHUB_WORKSPACE/build/oracle/evasion.tsv"
          -PoracleStab="$GITHUB_WORKSPACE/build/oracle/stab.tsv"
          -PoracleBurnDamage="$GITHUB_WORKSPACE/build/oracle/burn-damage.tsv"
          -PoracleStatusSkip="$GITHUB_WORKSPACE/build/oracle/status-skip.tsv"
          -PoracleStatusSkipExceptions="$GITHUB_WORKSPACE/build/oracle/status-skip-exceptions.tsv"
          -PoracleMoveFrequency="$GITHUB_WORKSPACE/build/oracle/move-frequency.tsv"
          -PoracleRoundLifecycle="$GITHUB_WORKSPACE/build/oracle/round-lifecycle.tsv"
          -PoraclePhaseLifecycle="$GITHUB_WORKSPACE/build/oracle/phase-lifecycle.tsv"
          -PoraclePinkPearl="$GITHUB_WORKSPACE/build/oracle/pink-pearl.tsv"
          -PoracleMegaLauncher="$GITHUB_WORKSPACE/build/oracle/mega-launcher.tsv"
          -PoracleTemporaryEffectPayload="$GITHUB_WORKSPACE/build/oracle/temporary-effect-payload.tsv"
          -PoracleDelayedHit="$GITHUB_WORKSPACE/build/oracle/delayed-hit.tsv"
          -PoracleDamageHistory="$GITHUB_WORKSPACE/build/oracle/damage-history.tsv"
          -PoracleStatusApplication="$GITHUB_WORKSPACE/build/oracle/status-application.tsv"
          -PoracleLancerPhase="$GITHUB_WORKSPACE/build/oracle/lancer-phase.tsv"
          -PoraclePerkPhase="$GITHUB_WORKSPACE/build/oracle/perk-phase.tsv"
          -PoracleCombatStageHooks="$GITHUB_WORKSPACE/build/oracle/combat-stage-hooks.tsv"
          -PoracleSpatialDamageAuras="$GITHUB_WORKSPACE/build/oracle/spatial-damage-auras.tsv"
          -PoracleMoveKeyword="$GITHUB_WORKSPACE/build/oracle/move-keywords.tsv"
          -PoracleAnalytic="$GITHUB_WORKSPACE/build/oracle/analytic.tsv"
          -PoracleInitiativeTurn="$GITHUB_WORKSPACE/build/oracle/initiative-turn.tsv"
          -PoraclePokemonInitiativeEntry="$GITHUB_WORKSPACE/build/oracle/pokemon-initiative-entry.tsv"
          -PoracleInitiativeRoundModifier="$GITHUB_WORKSPACE/build/oracle/initiative-round-modifier.tsv"
          -PoracleInitiativeSpeedAbility="$GITHUB_WORKSPACE/build/oracle/initiative-speed-ability.tsv"