name: Trainer Round Feature Contract

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  trainer-round-feature-contract:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python Trainer round-feature contract
        run: |
          python3 -m py_compile tools/python/export_trainer_round_feature_contract.py
          python3 tools/python/export_trainer_round_feature_contract.py \
            --source-root python-oracle \
            --output build/oracle/trainer-round-feature-contract.tsv
          cat build/oracle/trainer-round-feature-contract.tsv

      - name: Run Trainer round-feature contract parity test
        run: gradle test --stacktrace --tests io.autoptu.core.runtime.RoundTrainerFeatureLifecyclePolicyOracleParityTest
