name: Round Start Trainer Feature Lifecycle Parity

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  round-start-trainer-feature-lifecycle:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Freeze Python round-start Trainer Feature lifecycle
        run: |
          python3 -m py_compile tools/python/export_round_start_trainer_feature_lifecycle_fixture.py
          python3 tools/python/export_round_start_trainer_feature_lifecycle_fixture.py \
            --source-root python-oracle \
            --output build/oracle/round-start-trainer-feature-lifecycle.tsv
          cat build/oracle/round-start-trainer-feature-lifecycle.tsv

      - name: Run round-start Trainer Feature lifecycle differential
        run: gradle test --stacktrace --tests io.autoptu.core.runtime.RoundStartTrainerFeatureLifecycleOracleParityTest

      - name: Run round-start lifecycle wiring tests
        run: gradle test --stacktrace --tests io.autoptu.core.runtime.RoundStartTrainerFeatureLifecycleHookTest

      - name: Re-run invocation composition contract
        run: gradle test --stacktrace --tests io.autoptu.core.runtime.TrainerFeatureInvocationExecutorTest
