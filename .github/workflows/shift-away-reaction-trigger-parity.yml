name: Shift Away Reaction Trigger Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/hook/ShiftAwayReactionTriggerDetector.java"
      - "src/main/java/io/autoptu/core/hook/ShiftReactionWindowDiscovery.java"
      - "src/test/java/io/autoptu/core/hook/ShiftAwayReactionTriggerDetectorTest.java"
      - "src/test/java/io/autoptu/core/hook/ShiftReactionWindowDiscoveryTest.java"
      - "tools/python/export_shift_away_trigger_fixtures.py"
      - "tools/python/export_shift_reaction_window_fixtures.py"
      - ".github/workflows/shift-away-reaction-trigger-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python oracle fixtures
        run: |
          python3 -m py_compile tools/python/export_shift_away_trigger_fixtures.py tools/python/export_shift_reaction_window_fixtures.py
          python3 tools/python/export_shift_away_trigger_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/shift-away-trigger.tsv
          python3 tools/python/export_shift_reaction_window_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/shift-reaction-window.tsv

      - name: Run Shift-away trigger and reaction-window parity
        env:
          AUTOPTU_SHIFT_AWAY_TRIGGER_ORACLE: ${{ github.workspace }}/build/oracle/shift-away-trigger.tsv
          AUTOPTU_SHIFT_REACTION_WINDOW_ORACLE: ${{ github.workspace }}/build/oracle/shift-reaction-window.tsv
        run: |
          gradle test \
            --tests io.autoptu.core.hook.ShiftAwayReactionTriggerDetectorTest \
            --tests io.autoptu.core.hook.ShiftReactionWindowDiscoveryTest \
            --stacktrace
