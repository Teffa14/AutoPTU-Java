name: Shell Shield Pre-Damage Parity

on:
  pull_request:
    paths:
      - "src/main/java/io/autoptu/core/hook/BuiltinPreDamageReactionHooks.java"
      - "src/main/java/io/autoptu/core/hook/ShellShieldPreDamageReaction.java"
      - "src/test/java/io/autoptu/core/hook/ShellShieldPreDamageReactionTest.java"
      - "src/test/java/io/autoptu/core/hook/ShellShieldPreDamageOracleParityTest.java"
      - "tools/python/export_shell_shield_pre_damage_fixtures.py"
      - ".github/workflows/shell-shield-pre-damage-parity.yml"
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Java port
        uses: actions/checkout@v4

      - name: Check out pinned Python oracle
        uses: actions/checkout@v4
        with:
          repository: Teffa14/AutoPTU
          ref: 16d228efa63aabecb67fa788959a359aac7f8f03
          path: python-oracle

      - name: Use preinstalled Java 21 and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          gradle --version

      - name: Export Python Shell Shield contract
        run: |
          python3 -m py_compile tools/python/export_shell_shield_pre_damage_fixtures.py
          python3 tools/python/export_shell_shield_pre_damage_fixtures.py \
            --source-root python-oracle \
            --output build/oracle/shell-shield-pre-damage.tsv

      - name: Run Shell Shield parity
        env:
          AUTOPTU_SHELL_SHIELD_PRE_DAMAGE_ORACLE: ${{ github.workspace }}/build/oracle/shell-shield-pre-damage.tsv
        run: |
          gradle test \
            --tests io.autoptu.core.hook.ShellShieldPreDamageOracleParityTest \
            --tests io.autoptu.core.hook.ShellShieldPreDamageReactionTest \
            --stacktrace
